name: collect-and-deploy

on:
  # 2027 수시 접수 종료(2026-09-11)로 예약 실행 중지. 정시 등 재사용 시 아래 schedule 을 되살릴 것.
  # schedule:
  #   - cron: "5,35 22-23,0-15 * * *"   # KST 07:05~00:35 매시 5분·35분
  workflow_dispatch:            # 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 직전 배포본의 상태(history·latest)를 내려받아 추이·증감을 이어간다 (커밋 없이 상태 유지)
      - name: Restore previous state from live site
        env:
          SITE: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          mkdir -p data
          for f in latest.json history.json; do
            code=$(curl -sS -o "data/$f" -w "%{http_code}" "$SITE/state/$f?nocache=$(date +%s)" || true)
            if [ "$code" != "200" ]; then echo "no previous $f ($code)"; rm -f "data/$f"; fi
          done
          ls -la data

      # 진학어플라이는 해외 IP를 차단하므로, 국내 PC가 30분마다 올리는 피드(jinhak-feed 브랜치)를 병합한다
      - name: Collect 2027 live ratios (+ merge domestic feed)
        env:
          FEED: ${{ format('https://raw.githubusercontent.com/{0}/jinhak-feed/feed.json', github.repository) }}
        run: python collect.py --workers 8 --feed "$FEED"

      - name: Build site
        run: python build.py

      # 회차별 결과를 아티팩트로 90일 보관 (PC가 꺼져 있던 시간대의 유웨이 수집분 보존용)
      - name: Archive this run's snapshot
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: data/latest.json
          retention-days: 90
          compression-level: 9

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
